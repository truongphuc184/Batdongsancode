<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng ký - Hệ Thống Bất Động Sản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/login-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
  <!-- Lớp phủ làm mờ nhẹ -->
  <div class="absolute inset-0 bg-gradient-to-tr from-black/60 via-black/40 to-indigo-950/40 backdrop-blur-[2px]"></div>

  <div class="relative z-10 w-full max-w-md my-4 sm:my-8">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-10 border border-white/50">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/30">
          <span class="material-symbols-outlined text-white text-3xl">person_add</span>
        </div>
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">Tạo tài khoản mới</h1>
        <p class="text-xs text-gray-500 mt-1 font-medium">Tham gia sàn giao dịch bất động sản</p>
      </div>

      <form id="registerForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Họ và tên</label>
          <input type="text" id="fullName" required placeholder="Nguyễn Văn A"
            class="w-full px-4 py-2.5 bg-gray-50/80 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent outline-none text-sm font-medium"/>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email</label>
          <input type="email" id="email" required placeholder="nhapemail@batdongsan.vn"
            class="w-full px-4 py-2.5 bg-gray-50/80 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent outline-none text-sm font-medium"/>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Mật khẩu</label>
          <input type="password" id="password" required placeholder="Tối thiểu 6 ký tự"
            class="w-full px-4 py-2.5 bg-gray-50/80 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent outline-none text-sm font-medium"/>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-gray-700 uppercase">Nhu cầu & Vai trò</label>
            <span class="text-[11px] text-indigo-600 font-semibold">(Có thể chọn nhiều mục)</span>
          </div>
          <p class="text-[11px] text-gray-500 mb-2">Bạn có thể vừa mua vừa bán hoặc vừa thuê vừa cho thuê:</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 bg-gray-50/70 cursor-pointer transition-all has-[:checked]:bg-indigo-50/80 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-950">
              <input type="checkbox" name="roleCheckbox" value="Buyer" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer" checked>
              <span class="font-semibold">🛒 Mua Bất động sản</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 bg-gray-50/70 cursor-pointer transition-all has-[:checked]:bg-indigo-50/80 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-950">
              <input type="checkbox" name="roleCheckbox" value="Seller" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
              <span class="font-semibold">🏠 Bán BĐS (Đăng tin)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 bg-gray-50/70 cursor-pointer transition-all has-[:checked]:bg-indigo-50/80 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-950">
              <input type="checkbox" name="roleCheckbox" value="Tenant" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
              <span class="font-semibold">🔑 Thuê nhà / Căn hộ</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 bg-gray-50/70 cursor-pointer transition-all has-[:checked]:bg-indigo-50/80 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-950">
              <input type="checkbox" name="roleCheckbox" value="Landlord" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
              <span class="font-semibold">🏢 Cho thuê BĐS</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 hover:border-indigo-300 bg-gray-50/70 cursor-pointer transition-all has-[:checked]:bg-indigo-50/80 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-950 sm:col-span-2">
              <input type="checkbox" name="roleCheckbox" value="Agent" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer">
              <span class="font-semibold">👔 Môi giới chuyên nghiệp (Agent / Broker)</span>
            </label>
          </div>
        </div>

        <div id="error-msg" class="text-red-500 text-xs font-semibold bg-red-50 p-2.5 rounded-xl border border-red-200 hidden"></div>
        <div id="success-msg" class="text-emerald-700 text-xs font-bold bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 hidden"></div>

        <button type="submit" id="reg-btn"
          class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/25 transition-all text-sm flex items-center justify-center gap-1.5 mt-2">
          <span>Đăng ký tài khoản</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </form>

      <p class="text-center mt-5 text-gray-500 text-xs font-medium">
        Đã có tài khoản? <a href="signin.html" class="text-indigo-600 font-bold hover:underline">Đăng nhập ngay</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const errDiv = document.getElementById('error-msg');
      const succDiv = document.getElementById('success-msg');

      const checkedRoles = Array.from(document.querySelectorAll('input[name="roleCheckbox"]:checked')).map(cb => cb.value);
      if (checkedRoles.length === 0) {
        errDiv.textContent = 'Vui lòng chọn ít nhất 1 nhu cầu / vai trò của bạn.';
        errDiv.classList.remove('hidden');
        return;
      }

      btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> Đang tạo tài khoản...';
      btn.disabled = true;
      errDiv.classList.add('hidden');
      succDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            role: checkedRoles[0],
            roles: checkedRoles
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errDiv.textContent = data.message || 'Đăng ký thất bại';
          errDiv.classList.remove('hidden');
          return;
        }
        succDiv.textContent = '🎉 Đăng ký thành công! Đang chuyển hướng sang đăng nhập...';
        succDiv.classList.remove('hidden');
        setTimeout(() => window.location.href = 'signin.html', 1200);
      } catch (err) {
        errDiv.textContent = 'Lỗi kết nối server';
        errDiv.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<span>Đăng ký tài khoản</span><span class="material-symbols-outlined text-sm">arrow_forward</span>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
