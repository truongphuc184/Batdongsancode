<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập - Hệ Thống Bất Động Sản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/login-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
  <!-- Lớp phủ làm dịu nền & làm mờ nhẹ để nổi bật form -->
  <div class="absolute inset-0 bg-gradient-to-tr from-black/60 via-black/40 to-indigo-950/40 backdrop-blur-[2px]"></div>

  <div class="relative z-10 w-full max-w-md">
    <!-- Thông báo nếu đang có phiên đăng nhập cũ -->
    <div id="alreadyLoggedInBanner" class="hidden mb-4 p-3 bg-indigo-50/90 border border-indigo-200 rounded-2xl flex items-center justify-between text-xs">
      <span class="text-indigo-900 font-medium">Bạn đã đăng nhập phiên trước đó</span>
      <div class="flex items-center gap-2">
        <a href="home_property_search.html" class="px-2.5 py-1 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700">Vào trang chủ ↗</a>
        <button type="button" onclick="clearOldSession()" class="text-gray-500 hover:text-red-500 font-semibold underline">Đăng xuất</button>
      </div>
    </div>

    <!-- Khung đăng nhập Glassmorphism cao cấp -->
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-10 border border-white/50">
      <div class="text-center mb-7">
        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
          <span class="material-symbols-outlined text-white text-3xl">real_estate_agent</span>
        </div>
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">Bất Động Sản</h1>
        <p class="text-xs text-gray-500 mt-1 font-medium">Đăng nhập để khám phá & đăng tin bất động sản</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5">Email tài khoản</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-lg">mail</span>
            <input type="email" id="email" required placeholder="nhapemail@batdongsan.vn"
              class="w-full pl-10 pr-4 py-3 bg-gray-50/80 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent outline-none transition text-sm font-medium"/>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-gray-700 uppercase">Mật khẩu</label>
            <span class="text-[11px] text-gray-400">(Mặc định: 123456)</span>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-lg">lock</span>
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 bg-gray-50/80 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent outline-none transition text-sm font-medium"/>
          </div>
        </div>

        <div id="error-msg" class="text-red-500 text-xs font-semibold bg-red-50 p-2.5 rounded-xl border border-red-200 hidden"></div>

        <button type="submit" id="login-btn"
          class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/25 transition-all text-sm flex items-center justify-center gap-1.5">
          <span>Đăng nhập ngay</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </form>

      <!-- Phím tắt đăng nhập nhanh tài khoản mẫu -->
      <div class="mt-6 pt-5 border-t border-gray-100">
        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-2 text-center">Tài khoản đăng nhập nhanh (Pass: 123456):</span>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[11px]">
          <button type="button" onclick="fillAccount('admin@batdongsan.vn')" class="py-1.5 px-2 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-lg font-bold border border-amber-200 truncate">
            🛡️ Admin
          </button>
          <button type="button" onclick="fillAccount('seller@batdongsan.vn')" class="py-1.5 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-lg font-bold border border-emerald-200 truncate">
            🏠 Người bán
          </button>
          <button type="button" onclick="fillAccount('agent@batdongsan.vn')" class="py-1.5 px-2 bg-purple-50 hover:bg-purple-100 text-purple-900 rounded-lg font-bold border border-purple-200 truncate">
            👔 Môi giới
          </button>
          <button type="button" onclick="fillAccount('buyer@batdongsan.vn')" class="py-1.5 px-2 bg-blue-50 hover:bg-blue-100 text-blue-900 rounded-lg font-bold border border-blue-200 truncate">
            🛒 Người mua
          </button>
          <button type="button" onclick="fillAccount('tenant@batdongsan.vn')" class="py-1.5 px-2 bg-cyan-50 hover:bg-cyan-100 text-cyan-900 rounded-lg font-bold border border-cyan-200 truncate">
            🔑 Người thuê
          </button>
          <button type="button" onclick="fillAccount('landlord@batdongsan.vn')" class="py-1.5 px-2 bg-rose-50 hover:bg-rose-100 text-rose-900 rounded-lg font-bold border border-rose-200 truncate">
            🏢 Cho thuê
          </button>
        </div>
      </div>

      <p class="text-center mt-6 text-gray-500 text-xs font-medium">
        Chưa có tài khoản? <a href="Register.html" class="text-indigo-600 font-bold hover:underline">Đăng ký tài khoản mới</a>
      </p>
    </div>

    <!-- Bản quyền chân trang -->
    <div class="text-center mt-4 text-xs text-white/80 font-medium">
      Hệ Thống Mua Bán & Cho Thuê Bất Động Sản © 2026
    </div>
  </div>

  <script>
    // Kiểm tra nếu có phiên cũ thì hiện banner tùy chọn, KHÔNG tự ý redirect
    if (localStorage.getItem('accessToken')) {
      const banner = document.getElementById('alreadyLoggedInBanner');
      if (banner) banner.classList.remove('hidden');
    }

    function clearOldSession() {
      localStorage.removeItem('accessToken');
      const banner = document.getElementById('alreadyLoggedInBanner');
      if (banner) banner.classList.add('hidden');
    }

    function fillAccount(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = '123456';
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errDiv = document.getElementById('error-msg');
      btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> Đang xác thực...';
      btn.disabled = true;
      errDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errDiv.textContent = data.message || 'Email hoặc mật khẩu không đúng';
          errDiv.classList.remove('hidden');
          return;
        }
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('token', data.accessToken);
        window.location.href = 'home_property_search.html';
      } catch (err) {
        errDiv.textContent = 'Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại backend!';
        errDiv.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<span>Đăng nhập ngay</span><span class="material-symbols-outlined text-sm">arrow_forward</span>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
