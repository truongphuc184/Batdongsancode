<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chi tiết BĐS - Bất Động Sản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0" rel="stylesheet"/>
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="home_property_search.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <span class="font-bold text-gray-800">Chi tiết bất động sản</span>
    </div>
  </header>

  <div id="content" class="max-w-3xl mx-auto px-4 mt-6">
    <div class="text-gray-400 text-center py-12">Đang tải...</div>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 z-50">
    <div class="flex justify-around items-center h-16 max-w-5xl mx-auto">
      <a href="home_property_search.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600">
        <span class="material-symbols-outlined">search</span>
        <span class="text-xs mt-1">Tìm kiếm</span>
      </a>
      <a href="user_profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600">
        <span class="material-symbols-outlined">person</span>
        <span class="text-xs mt-1">Hồ sơ</span>
      </a>
    </div>
  </nav>

  <script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = 'signin.html';

    function formatPrice(price) {
      if (price >= 1000000000) return (price / 1000000000).toFixed(1) + ' tỷ';
      if (price >= 1000000) return (price / 1000000).toFixed(0) + ' triệu';
      return price.toLocaleString('vi-VN') + ' đ';
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('content').innerHTML = '<p class="text-center text-gray-500 py-12">Không tìm thấy tin đăng</p>';
    } else {
      fetch('/api/listings/' + id)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(l => {
          document.getElementById('content').innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
              <div class="h-64 bg-gradient-to-br from-indigo-100 to-blue-50 flex items-center justify-center">
                <div class="text-center">
                  <div class="text-6xl">${l.type === 'Sale' ? '🏠' : '🏢'}</div>
                  <span class="mt-3 inline-block px-4 py-1.5 rounded-full text-sm font-medium ${l.type === 'Sale' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">
                    ${l.type === 'Sale' ? 'Bán' : 'Cho thuê'}
                  </span>
                </div>
              </div>
              <div class="p-6">
                <h1 class="text-2xl font-bold text-gray-800">${l.title}</h1>
                <p class="text-gray-500 mt-2 flex items-center gap-1">
                  <span class="material-symbols-outlined text-lg">location_on</span>
                  ${l.address ? l.address + ', ' : ''}${l.district ? l.district + ', ' : ''}${l.city}
                </p>
                <div class="text-3xl font-bold text-indigo-600 mt-4">${formatPrice(l.price)}</div>

                <div class="grid grid-cols-3 gap-4 mt-6 py-4 border-t border-b border-gray-100">
                  <div class="text-center">
                    <div class="text-2xl font-bold text-gray-800">${l.area || '-'}</div>
                    <div class="text-sm text-gray-500">m²</div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-bold text-gray-800">${l.bedrooms || '-'}</div>
                    <div class="text-sm text-gray-500">Phòng ngủ</div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-bold text-gray-800">${l.bathrooms || '-'}</div>
                    <div class="text-sm text-gray-500">Phòng tắm</div>
                  </div>
                </div>

                ${l.description ? `
                <div class="mt-6">
                  <h3 class="font-bold text-gray-800 mb-2">Mô tả</h3>
                  <p class="text-gray-600 leading-relaxed">${l.description}</p>
                </div>` : ''}

                <div class="mt-6">
                  <h3 class="font-bold text-gray-800 mb-2">Thông tin</h3>
                  <div class="grid grid-cols-2 gap-2 text-sm">
                    <div class="bg-gray-50 rounded-lg p-3"><span class="text-gray-500">Trạng thái</span><br><strong>${l.status}</strong></div>
                    <div class="bg-gray-50 rounded-lg p-3"><span class="text-gray-500">Người đăng</span><br><strong>${l.ownerName || 'N/A'}</strong></div>
                    <div class="bg-gray-50 rounded-lg p-3"><span class="text-gray-500">Ngày đăng</span><br><strong>${new Date(l.createdAt).toLocaleDateString('vi-VN')}</strong></div>
                    <div class="bg-gray-50 rounded-lg p-3"><span class="text-gray-500">Mã tin</span><br><strong>#${l.id}</strong></div>
                  </div>
                </div>

                <div class="mt-6 flex gap-3">
                  <a href="tel:" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-medium text-center hover:bg-indigo-700">📞 Liên hệ</a>
                  <button onclick="history.back()" class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200">← Quay lại</button>
                </div>
              </div>
            </div>
          `;
        })
        .catch(() => {
          document.getElementById('content').innerHTML = '<p class="text-center text-red-500 py-12">Không tìm thấy tin đăng này</p>';
        });
    }
  </script>
</body>
</html>
