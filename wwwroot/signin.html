<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập - Bất Động Sản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Bất Động Sản</h1>
      <p class="text-gray-500 mt-1">Đăng nhập vào tài khoản của bạn</p>
    </div>
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="example@email.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"/>
      </div>
      <div id="error-msg" class="text-red-500 text-sm hidden"></div>
      <button type="submit" id="login-btn"
        class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors">
        Đăng nhập
      </button>
    </form>
    <p class="text-center mt-6 text-gray-500 text-sm">
      Chưa có tài khoản? <a href="Register.html" class="text-indigo-600 font-medium hover:underline">Đăng ký ngay</a>
    </p>
  </div>
  <script>
    if (localStorage.getItem('accessToken')) {
      window.location.href = 'home_property_search.html';
    }
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errDiv = document.getElementById('error-msg');
      btn.textContent = 'Đang đăng nhập...';
      btn.disabled = true;
      errDiv.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errDiv.textContent = data.message || 'Email hoặc mật khẩu không đúng';
          errDiv.classList.remove('hidden');
          return;
        }
        localStorage.setItem('accessToken', data.accessToken);
        window.location.href = 'home_property_search.html';
      } catch (err) {
        errDiv.textContent = 'Lỗi kết nối server';
        errDiv.classList.remove('hidden');
      } finally {
        btn.textContent = 'Đăng nhập';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
